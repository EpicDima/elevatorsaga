<!--
  The app bar's own mark (buildAppBarSkeleton in src/widgets/app-bar/ui/app-bar.ts),
  coordinates unchanged; src/page.test.ts compares the two shape for shape.

  The accent is written out because a file under public/ is copied by the build
  without ever meeting src/shared/styles/tokens.css. It is the dark theme's
  ds-accent, brass that reads against a light tab strip and a dark one alike, and
  the ground behind it stays transparent so the frame is the outermost thing drawn.

  No double hyphen anywhere in this comment: XML forbids one inside a comment, and
  a browser that meets one refuses the whole file and falls back to a blank glyph.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" role="img" aria-label="Elevator Saga">
  <title>Elevator Saga</title>
  <rect
    x="2"
    y="1.5"
    width="18"
    height="19"
    rx="2.5"
    fill="none"
    stroke="#e8a33f"
    stroke-width="1.5"
  />
  <rect x="5" y="9" width="5.5" height="8.5" rx="1" fill="#e8a33f" opacity=".9" />
  <rect x="12" y="4" width="5" height="8.5" rx="1" fill="#e8a33f" opacity=".45" />
</svg>
