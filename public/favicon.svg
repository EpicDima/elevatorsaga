<!--
  The app bar's mark (src/widgets/app-bar/ui/app-bar.ts), in the dark theme's
  ds-accent over ds-bg: public/ is copied without ever meeting tokens.css. The
  ground is the frame's own fill, so it stops at the stroke's center line.
  No double hyphen in this comment: XML forbids one, and a browser drops the file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" role="img" aria-label="Elevator Saga">
  <title>Elevator Saga</title>
  <rect
    x="2"
    y="1.5"
    width="18"
    height="19"
    rx="2.5"
    fill="#131519"
    stroke="#e8a33f"
    stroke-width="1.5"
  />
  <rect x="5" y="9" width="5.5" height="8.5" rx="1" fill="#e8a33f" opacity=".9" />
  <rect x="12" y="4" width="5" height="8.5" rx="1" fill="#e8a33f" opacity=".45" />
</svg>
