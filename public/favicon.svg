<!--
  The tab icon: the app bar's own brand mark, so the glyph in the tab strip and
  the glyph beside the game's name are the same drawing rather than two ideas
  about what this site looks like. `buildAppBarSkeleton` in
  src/widgets/app-bar/ui/app-bar.ts builds that mark, and the frame and two cars
  below carry its coordinates unchanged; src/page.test.ts compares them, so
  moving one without the other fails.

  No double hyphen anywhere in this comment, which is why it reads as it does.
  This file is XML, not HTML, and XML forbids one inside a comment: the favicon
  this replaces wrote its dashes the way every other comment in the repository
  writes them, so every browser refused the whole document ("Double hyphen
  within comment") and every tab fell back to the blank-page glyph for as long
  as the file existed. src/page.test.ts parses it now rather than only checking
  that it starts with an svg tag.

  Two differences from the bar's mark, both because a tab is not an app bar:

  * A plate is added beneath the drawing. Transparent artwork lands on whatever
    color the browser paints its tab strip, the one color a static file cannot
    know, so the plate carries the near-black the bar itself stands on and the
    tab shows what the bar shows. Its corner keeps the frame's proportion
    (2.5 on an 18-wide frame is 3 on a 22-wide plate).

  * The colors are written out rather than inherited. They are the palette's
    darkest neutral (ds-n-0) and the dark theme's accent (ds-accent) from
    src/shared/styles/tokens.css, named here without the two leading hyphens a
    property carries, since this comment cannot hold them. A file under public/
    is copied by the build without ever meeting the stylesheet, so it could not
    read the properties themselves in any case. The dark
    pair serves both themes on purpose: brass on near-black reads against a
    light tab strip and a dark one alike, where the light theme's deeper brass
    on its own pale ground would disappear into a white one.

  Original artwork, deliberately. The twelve Font Awesome outlines in
  src/shared/ui/icon.ts would have been the quicker answer, but they carry the
  SIL Open Font License, and a mark that stands for the site is not something to
  owe attribution for. Nothing here is copied from anywhere.

  Two cars at two heights, and no more than that, because at 16px detail is
  noise. The far car is dim by design, the same depth cue the bar draws, and it
  fades to almost nothing at tab size, which is fine: one car in a shaft is
  still an elevator.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" role="img" aria-label="Elevator Saga">
  <title>Elevator Saga</title>
  <rect width="22" height="22" rx="3" fill="#131519" />
  <rect
    x="2"
    y="1.5"
    width="18"
    height="19"
    rx="2.5"
    fill="none"
    stroke="#e8a33f"
    stroke-width="1.5"
  />
  <rect x="5" y="9" width="5.5" height="8.5" rx="1" fill="#e8a33f" opacity=".9" />
  <rect x="12" y="4" width="5" height="8.5" rx="1" fill="#e8a33f" opacity=".45" />
</svg>
