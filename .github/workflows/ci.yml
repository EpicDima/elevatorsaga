name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run already in
# flight irrelevant, so let it go rather than paying for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every Node version's failures, not just the first one's.
      fail-fast: false
      matrix:
        # Only the active LTS lines. Odd-numbered Node releases (23, 25, ...)
        # are "Current" only: they ship for six months and are never promoted
        # to LTS, so nobody should be running the tooling on them and covering
        # them would add noise rather than signal. `engines` requires >= 22.
        node: ["22", "24"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # One leg is enough: the report does not depend on the Node version.
      - name: Upload coverage report
        if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error
