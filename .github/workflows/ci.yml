name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run already in
# flight irrelevant, so let it go rather than paying for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every Node version's failures, not just the first one's.
      fail-fast: false
      matrix:
        # Only the active LTS lines. Odd-numbered Node releases (23, 25, ...)
        # are "Current" only: they ship for six months and are never promoted
        # to LTS, so nobody should be running the tooling on them and covering
        # them would add noise rather than signal. `engines` requires >= 22.
        node: ["22", "24"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # One leg is enough: the report does not depend on the Node version.
      - name: Upload coverage report
        if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  # A job of its own, and deliberately not a dependant of `check`: the two run
  # side by side, so the fast checks report in about a minute whether or not a
  # browser has to be fetched. One Node version is enough — this asks whether
  # the built site works in a browser, not whether it builds on both LTS lines,
  # and `check` already answers the second question. Node 24 is what
  # `deploy.yml` publishes the site with.
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser is about 100 MB and only ever changes when the Playwright
      # version does, so it is restored from cache rather than downloaded on
      # every push.
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser but not the system libraries it links
      # against, which apt installed outside the cached directory.
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `playwright.config.ts` runs the build and serves `dist/` itself: the
      # tests deliberately exercise the production bundle, not the dev server.
      - name: Test
        id: e2e
        run: npm run test:e2e

      # Only when the tests themselves failed, and only then: on a green run
      # there is nothing in the report anyone wants. `warn` rather than `error`
      # because a run that died before the reporter wrote anything has already
      # failed for a reason worth reading, and a second failure here would only
      # bury it.
      - name: Upload Playwright report
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
