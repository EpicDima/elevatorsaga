name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes the run in flight, except on `main`, where canceling
# part way through `deploy-pages` would leave the site half published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One Node leg, the same one `e2e` and `deploy` use. Nothing here is
  # version-specific, so the `>= 22` in `engines` goes unproven.
  check:
    name: Checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Vitest starts the slowest file first, going by timings that `npm ci` has
      # just emptied from node_modules. A miss only costs the ordering.
      - name: Restore the record of how long each test file takes
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/vitest
          key: vitest-timings-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vitest-timings-${{ runner.os }}-

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The only run of the entry point itself: real standard output, and the
      # type stripping a `.ts` command rests on. `--json` stays pipeable while
      # the player's own logs go to standard error.
      - name: Score a program from the command line
        run: |
          cat > "$RUNNER_TEMP/program.js" <<'PROGRAM'
          {
            init: function (elevators, floors) {
              console.log("this line belongs on standard error");
              elevators.forEach(function (elevator) {
                elevator.on("idle", function () {
                  elevator.goToFloor(floors[floors.length - 1].floorNum());
                  elevator.goToFloor(0);
                });
              });
            },
            update: function () {},
          }
          PROGRAM
          npm run bench -- --help > /dev/null
          node src/cli/bench.ts "$RUNNER_TEMP/program.js" --seeds 1 --json > "$RUNNER_TEMP/report.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const scored = report.scenarios.filter((scenario) => scenario.result.transportedCount > 0);
            if (scored.length === 0 || scored.length !== report.scenarios.length) {
              throw new Error(`The command scored nothing: ${JSON.stringify(report)}`);
            }
            console.log(`Scored ${scored.length} buildings from the command line.`);
          ' "$RUNNER_TEMP/report.json"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 5
          if-no-files-found: error

  # Not a dependant of `check`: the two run side by side, so the fast checks
  # report without waiting on a browser download.
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # From the installed package, so the key names the version that launches.
      - name: Note which Playwright the browser has to match
        id: playwright
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # The browser only changes when Playwright does, so the key is that
      # version rather than the lockfile's hash.
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The runner image ships Chrome, so its libraries are usually there
      # already: launching asks in a second, and apt only runs when they aren't.
      - name: Install Chromium's system dependencies, if the runner is missing any
        run: |
          node -e 'require("@playwright/test").chromium.launch().then((browser) => browser.close())' ||
            npx playwright install-deps chromium

      # `playwright.config.ts` builds and serves `dist/`: the tests exercise the
      # production bundle, not the dev server.
      - name: Test
        id: e2e
        run: npm run test:e2e

      # Nothing in a green run's report is worth keeping. `warn`, because a run
      # that died before the reporter wrote anything already failed loudly.
      - name: Upload Playwright report
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
          if-no-files-found: warn

  # `main` only: on a pull request `github.ref` never matches. Settings -> Pages
  # -> Build and deployment -> Source has to be "GitHub Actions", or the last
  # step below has nothing to publish to.
  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7

    # Overrides the workflow-wide `contents: read`, so the token that can write
    # a deployment exists only where one is written.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Never cancel a deployment in flight — a half-published site is worse than
    # a stale one. The group above serializes runs, this one the deployments.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Built again rather than carried from `check`, so re-running this job
      # republishes from source. `vite build` skips the typecheck `check` has
      # already run on these bytes.
      - name: Build the site
        run: npx vite build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The default ten-minute wait outlives the job timeout above, which
          # would end the job without releasing the `pages` group.
          timeout: 300000
