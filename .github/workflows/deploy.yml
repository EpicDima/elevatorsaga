name: Deploy to GitHub Pages

# Manual only, deliberately.
#
# Pages has to be pointed at Actions in the repository settings before a push
# trigger would publish anything, so until someone does that this workflow has
# to be asked for: Actions -> "Deploy to GitHub Pages" -> "Run workflow".
#
# To make it automatic instead:
#   1. Settings -> Pages -> Build and deployment -> Source: switch from "Deploy
#      from a branch" to "GitHub Actions". While the source is a branch, this
#      workflow's deploy step has nothing to publish to and will fail.
#   2. Add a push trigger below, next to `workflow_dispatch:`:
#        push:
#          branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two versions of the site at once, and never cancel a deployment
# that is already in flight — a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # `vite.config.ts` sets `base: "./"`, so the bundle already works from a
      # project sub-path such as /<repo>/ and needs no base-path injection here.
      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
