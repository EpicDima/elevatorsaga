<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      data-i18n names the message an element's words come from, and
      data-i18n-attr the messages its attributes come from; src/ui/localise-page.ts
      applies both at start-up and again whenever the language changes. The
      English written out below is what a reader without JavaScript, and every
      crawler, gets to see, and src/ui/localise-page.test.ts checks that it is
      still word for word the English message it names.
    -->
    <title data-i18n="page.title">Elevator Saga - the elevator programming game</title>
    <meta
      name="description"
      content="Elevator Saga is a programming game: write JavaScript to transport people efficiently."
      data-i18n-attr="content:page.description"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The link preview, for chat clients and social sites. The image is
      public/images/screenshot.png, the same picture the README uses, which Vite
      copies to dist/images/ untouched.

      Both URLs are site-relative on purpose. `vite.config.ts` sets `base: "./"`
      so the build runs from whatever directory it is dropped into, and this game
      has no canonical home to hard-code — the repository's own Pages URL is
      unpublished and 404s today. Open Graph asks for absolute URLs and every
      crawler worth naming resolves relative ones against the page instead, so a
      relative URL is both the honest answer and the working one. Vite rewrites
      the leading slash to the base at build time.
    -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Elevator Saga - the elevator programming game"
      data-i18n-attr="content:page.title"
    />
    <meta
      property="og:description"
      content="Elevator Saga is a programming game: write JavaScript to transport people efficiently."
      data-i18n-attr="content:page.description"
    />
    <meta property="og:image" content="/images/screenshot.png" />
    <meta
      property="og:image:alt"
      content="Four elevators carrying people between six floors, with the JavaScript program driving them in the editor below."
      data-i18n-attr="content:page.imageAlt"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="module" src="/src/main.ts"></script>
  </head>
  <!--
    `app` is what tells src/app/styles/document.css this is the game and not one
    of the two help pages it also dresses: the frame below -- a full-height column that
    does not scroll, with a 1040x600 floor under it -- would cut a nine-hundred
    line reference page off at the first screenful.
  -->
  <body class="app">
    <!--
      The first thing the keyboard reaches, and the only thing before the
      building. src/main.ts intercepts it and puts the focus inside CodeMirror,
      which is where the target `<div>` only holds; the `href` is what keeps the
      link a link, and what the browser falls back to.
    -->
    <a class="skip-link" href="#code" data-i18n="page.skipLink">Skip to the code editor</a>

    <!--
      The page's heading, and all that is left of the header this file used to
      ship. src/main.ts replaces this whole element with widgets/app-bar's own
      <header class="appbar">, whose brand name is the live page's <h1> -- so
      there is exactly one heading and one banner before the bundle runs and
      exactly one of each afterwards.

      What stood here besides the title is gone rather than moved. The learning
      track has a block of its own in the app bar's level switcher, so the
      header link was a second entrance to a place already on screen; the three
      help links are answered by the docs dialog the bar's own button opens
      (documentation.html and documentation.ru.html are still built and still
      readable, they are simply no longer linked from the game); and the
      language picker moved into the settings popover, which is where
      design/ui-mockup.html puts everything a player touches once an evening.
    -->
    <header>
      <h1 data-i18n="page.brand">Elevator Saga</h1>
    </header>

    <!--
      The one piece of the page that cannot be localised at run time, and the
      one that does not need to be: when scripting is enabled a browser parses
      the children of <noscript> as text, so there is no element here to write
      a message into, and when scripting is disabled there is nothing to write
      it with. page.noscript is in the catalogue for the day the build renders
      this file per language.
    -->
    <noscript>
      <p>
        Your browser does not appear to support JavaScript. This page contains a browser-based
        programming game implemented in JavaScript.
      </p>
    </noscript>

    <main>
      <!-- widgets/goal-bar draws the current level's meters and tier popover here. -->
      <div class="level"></div>

      <!--
        The learning track's panel, drawn by widgets/tutorial-panel. Empty
        on every route but the track, and the stylesheet hides it while it is
        -- the same way the language picker is hidden while it has no options.
        It carries no data-i18n: the presenter asks the catalogue for every
        word at the moment it draws, so there is nothing here to translate.

        On screen it stands beside the building, not above it: src/main.ts
        moves this element and .world together into a .stagearea row of the
        game pane. It is a child of <main> here for the reason .controls
        below is -- the App constructor draws into it long before that row
        exists -- and the row is built above the world's own subtree rather
        than inside it because that subtree is emptied and rebuilt on every
        restart. See .stagearea in
        src/widgets/workspace-layout/ui/workspace-layout.css for the whole of it.
      -->
      <div class="tutorial"></div>

      <!--
        The run controls, drawn by presentControls in src/pages/game/index.ts.
        Here in the markup, and in the app bar on screen: src/main.ts moves
        this element into the bar the moment the bar exists. It is here at all
        because presentControls runs in the App constructor, which is a long
        way before that, and outside everything that gets redrawn because it is
        the one region that has to survive a restart. Empty for the same reason
        .tutorial is: the presenter asks the catalogue for every word at the
        moment it writes it.

        No role and no name of its own. It holds the mockup's .runbox and
        .speed, which name themselves -- the two run buttons by their labels,
        the speed group by its own role="group" -- and a third name wrapped
        around them would only be one more thing to read past.
      -->
      <div class="controls"></div>

      <!--
        The building is wider than the page on a narrow window and .world
        scrolls horizontally to reach it. A scroll container is only
        reachable by keyboard if it can take focus, so it is in the tab
        order, and something in the tab order needs a role and a name.
      -->
      <div
        class="world"
        tabindex="0"
        role="region"
        aria-label="Building"
        data-i18n-attr="aria-label:page.world.label"
      >
        <div class="worldtrack">
          <!--
            The live region is this container, which is always in the
            document, not the .verdict card that presentVerdictToast puts
            inside it: a role="status" that arrives already populated is
            usually not announced.

            A sibling of .innerworld, and not a box inside the stage the way
            design/ui-mockup.html has it, for the same reason: everything
            below .innerworld is emptied and rebuilt on every redraw of the
            world, and a live region rebuilt under a screen reader announces
            nothing at all. The two boxes cover the same pixels anyway -- see
            .feedbackcontainer's own rule in
            src/widgets/verdict-toast/ui/verdict-toast.css, which is where the
            card is placed over the building.
          -->
          <div class="feedbackcontainer" role="status"></div>
          <div class="innerworld"></div>
        </div>
      </div>

      <!--
        widgets/stats-panel draws the run's live figures here. A sibling of
        .world rather than a box inside it: design/ui-mockup.html docks its
        own .stats as the last row of the game pane, below the building and
        the full width of it, so this element is the row and not a corner
        floated over the stage. src/main.ts appends it to .pane-game last, in
        this order.
      -->
      <div
        class="statscontainer"
        role="group"
        aria-label="Simulation statistics"
        data-i18n-attr="aria-label:page.stats.label"
      ></div>

      <!--
        widgets/editor-pane draws the slot switcher, the reset/undo-reset
        tools and the error banner here, and mounts CodeMirror inside its own
        `.editor` -- see src/ui/editor.ts and the widget's own module
        comment. `id="code"` stays on this element rather than moving to the
        `.editor` mount two levels in, so the skip link's `href="#code"`
        needs no change.
      -->
      <div class="code" id="code"></div>
    </main>

    <!--
      The one thing the editor still says for itself, and the only element on
      this page that is deliberately never seen.

      design/ui-mockup.html has no status line under the editor: «код
      сохраняется сам — сообщать об этом каждый раз нечего», and the save
      confirmation it dropped was indeed a line that reported the same
      success every second of every session. A refused write is the opposite
      kind of news -- the program is no longer being saved, and nothing else
      on screen would ever say so -- so that half of the old line survives
      here, announced rather than drawn: `role="status"` reaches a screen
      reader, and .visually-hidden keeps the page looking exactly like the
      mockup. src/main.ts fills it, and empties it again the moment a write
      gets through.

      Outside <main> because widgets/workspace-layout reparents everything
      inside it into one of the two panes, and this belongs to neither; it is
      taken out of the flow by its own class, so where it sits changes no
      layout either way.
    -->
    <p class="visually-hidden" id="storage_status" role="status"></p>
  </body>
</html>
